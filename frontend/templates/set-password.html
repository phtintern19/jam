<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Set Password - JamRig</title>
    <link rel="stylesheet" href="/css/styles.css?v=premium-animated-v1">
    <link rel="stylesheet" href="/css/saas-theme.css?v=global-v1">
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #000000;
            color: #ffffff;
            font-family: 'Inter', system-ui, -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 2rem;
        }

        .password-container {
            max-width: 500px;
            width: 100%;
            background: rgba(10, 10, 10, 0.9);
            border: 2px solid #00ffff;
            border-radius: 20px;
            padding: 3rem;
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.3);
        }

        .password-header {
            text-align: center;
            margin-bottom: 2rem;
        }

        .password-icon {
            font-size: 3rem;
            color: #00ffff;
            text-shadow: 0 0 20px #00ffff;
            margin-bottom: 1rem;
        }

        .password-title {
            font-size: 2rem;
            font-weight: 700;
            color: #00ffff;
            text-shadow: 0 0 10px #00ffff;
            margin-bottom: 0.5rem;
        }

        .password-subtitle {
            color: #ffffff;
            font-size: 1rem;
            line-height: 1.6;
        }

        .form-group {
            margin-bottom: 1.5rem;
        }

        .form-group label {
            display: block;
            margin-bottom: 0.5rem;
            color: #00ffff;
            font-weight: 500;
            text-shadow: 0 0 5px #00ffff;
        }

        .form-group input {
            width: 100%;
            padding: 0.875rem;
            background: rgba(0, 0, 0, 0.8);
            border: 2px solid #00ffff;
            border-radius: 10px;
            color: #ffffff;
            font-size: 1rem;
            transition: all 0.3s ease;
        }

        .form-group input:focus {
            outline: none;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.5);
        }

        .form-group input::placeholder {
            color: #64748b;
        }

        .password-requirements {
            background: rgba(0, 255, 255, 0.1);
            border: 2px solid #00ffff;
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }

        .requirement {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            margin-bottom: 0.5rem;
            font-size: 0.875rem;
            color: #ffffff;
        }

        .requirement:last-child {
            margin-bottom: 0;
        }

        .requirement i {
            color: #64748b;
            transition: color 0.3s ease;
        }

        .requirement.met i {
            color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
        }

        .requirement.met {
            color: #00ff00;
        }

        .submit-btn {
            background: linear-gradient(135deg, #00ffff, #ff00ff);
            color: #000000;
            border: none;
            padding: 1rem 2rem;
            border-radius: 10px;
            font-size: 1.1rem;
            font-weight: 600;
            cursor: pointer;
            width: 100%;
            box-shadow: 0 0 20px rgba(0, 255, 255, 0.3);
            transition: all 0.3s ease;
        }

        .submit-btn:hover {
            transform: scale(1.05);
            box-shadow: 0 0 30px rgba(0, 255, 255, 0.8);
        }

        .submit-btn:disabled {
            opacity: 0.5;
            cursor: not-allowed;
            transform: none;
        }

        .error-message {
            color: #ff0000;
            margin-top: 1rem;
            font-size: 0.9rem;
            text-shadow: 0 0 5px #ff0000;
            text-align: center;
        }

        .success-message {
            color: #00ff00;
            margin-top: 1rem;
            font-size: 0.9rem;
            text-shadow: 0 0 5px #00ff00;
            text-align: center;
        }

        .loading {
            display: inline-block;
            animation: spin 1s linear infinite;
        }

        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }

        .invitation-info {
            background: rgba(0, 255, 0, 0.1);
            border: 2px solid #00ff00;
            border-radius: 10px;
            padding: 1rem;
            margin-bottom: 1.5rem;
        }

        .invitation-info p {
            margin-bottom: 0.5rem;
            color: #ffffff;
        }

        .invitation-info strong {
            color: #00ff00;
            text-shadow: 0 0 5px #00ff00;
        }
    </style>
</head>
<body>
    <div class="saas-background"></div>
    <div class="saas-noise"></div>
    <div class="password-container">
        <div class="password-header">
            <div class="password-icon">
                <i class="fas fa-lock"></i>
            </div>
            <h1 class="password-title">Set Your Password</h1>
            <p class="password-subtitle">Create a secure password to complete your registration</p>
        </div>

        <div id="loadingState">
            <i class="fas fa-spinner fa-spin fa-2x" style="color: #00ffff;"></i>
            <p style="margin-top: 1rem; text-align: center;">Loading...</p>
        </div>

        <div id="passwordForm" style="display: none;">
            <div class="invitation-info" id="invitationInfo">
                <!-- Invitation details will be loaded here -->
            </div>

            <form id="setPasswordForm" onsubmit="handleSetPassword(event)">
                <div class="form-group">
                    <label for="username">Username *</label>
                    <input type="text" id="username" name="username" required placeholder="Choose a username" minlength="3" maxlength="50">
                </div>

                <div class="form-group">
                    <label for="password">Password *</label>
                    <input type="password" id="password" name="password" required placeholder="Create a password" minlength="8" oninput="validatePassword()">
                </div>

                <div class="password-requirements">
                    <div class="requirement" id="req-length">
                        <i class="fas fa-circle"></i>
                        <span>At least 8 characters</span>
                    </div>
                    <div class="requirement" id="req-uppercase">
                        <i class="fas fa-circle"></i>
                        <span>At least one uppercase letter (A-Z)</span>
                    </div>
                    <div class="requirement" id="req-lowercase">
                        <i class="fas fa-circle"></i>
                        <span>At least one lowercase letter (a-z)</span>
                    </div>
                    <div class="requirement" id="req-number">
                        <i class="fas fa-circle"></i>
                        <span>At least one number (0-9)</span>
                    </div>
                    <div class="requirement" id="req-special">
                        <i class="fas fa-circle"></i>
                        <span>At least one special character (!@#$%^&*)</span>
                    </div>
                </div>

                <div class="form-group">
                    <label for="confirmPassword">Confirm Password *</label>
                    <input type="password" id="confirmPassword" name="confirmPassword" required placeholder="Confirm your password">
                </div>

                <button type="submit" id="submitBtn" class="submit-btn">
                    <i class="fas fa-check-circle"></i> Set Password & Complete Registration
                </button>

                <div id="errorMessage" class="error-message"></div>
                <div id="successMessage" class="success-message"></div>
            </form>
        </div>

        <div id="errorState" style="display: none;">
            <i class="fas fa-exclamation-triangle fa-3x" style="color: #ff0000; margin-bottom: 1rem;"></i>
            <h2 style="color: #ff0000; margin-bottom: 1rem; text-align: center;">Error</h2>
            <p id="errorText" style="color: #ffffff; margin-bottom: 2rem; text-align: center;"></p>
            <a href="/" class="submit-btn" style="display: inline-block; text-decoration: none; text-align: center;">
                <i class="fas fa-home"></i> Return to Home
            </a>
        </div>
    </div>

    <script>
        const urlParams = new URLSearchParams(window.location.search);
        const token = urlParams.get('token');

        function validatePassword() {
            const password = document.getElementById('password').value;
            
            const requirements = {
                length: password.length >= 8,
                uppercase: /[A-Z]/.test(password),
                lowercase: /[a-z]/.test(password),
                number: /[0-9]/.test(password),
                special: /[!@#$%^&*]/.test(password)
            };

            Object.keys(requirements).forEach(key => {
                const element = document.getElementById(`req-${key}`);
                if (requirements[key]) {
                    element.classList.add('met');
                } else {
                    element.classList.remove('met');
                }
            });

            return Object.values(requirements).every(Boolean);
        }

        async function handleSetPassword(event) {
            event.preventDefault();
            
            const submitBtn = document.getElementById('submitBtn');
            const errorMessage = document.getElementById('errorMessage');
            const successMessage = document.getElementById('successMessage');
            
            const username = document.getElementById('username').value;
            const password = document.getElementById('password').value;
            const confirmPassword = document.getElementById('confirmPassword').value;

            if (!validatePassword()) {
                errorMessage.textContent = 'Please meet all password requirements.';
                return;
            }

            if (password !== confirmPassword) {
                errorMessage.textContent = 'Passwords do not match.';
                return;
            }

            submitBtn.disabled = true;
            submitBtn.innerHTML = '<i class="fas fa-spinner loading"></i> Processing...';
            errorMessage.textContent = '';
            successMessage.textContent = '';

            try {
                const response = await fetch('/api/set-password', {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    },
                    body: JSON.stringify({
                        token: token,
                        username: username,
                        password: password
                    })
                });

                const data = await response.json();

                if (response.ok && data.success) {
                    successMessage.textContent = 'Password set successfully! Redirecting to login...';
                    setTimeout(() => {
                        window.location.href = '/?login=true';
                    }, 2000);
                } else {
                    errorMessage.textContent = data.message || 'Failed to set password. Please try again.';
                    submitBtn.disabled = false;
                    submitBtn.innerHTML = '<i class="fas fa-check-circle"></i> Set Password & Complete Registration';
                }
            } catch (error) {
                errorMessage.textContent = 'An error occurred. Please try again.';
                submitBtn.disabled = false;
                submitBtn.innerHTML = '<i class="fas fa-check-circle"></i> Set Password & Complete Registration';
            }
        }

        async function loadInvitationDetails() {
            if (!token) {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('errorState').style.display = 'block';
                document.getElementById('errorText').textContent = 'Invalid link. No token provided.';
                return;
            }

            try {
                const response = await fetch(`/api/check-invitation?token=${token}`);
                const data = await response.json();

                document.getElementById('loadingState').style.display = 'none';

                if (response.ok && data.success) {
                    document.getElementById('passwordForm').style.display = 'block';
                    document.getElementById('invitationInfo').innerHTML = `
                        <p><strong>Role:</strong> ${data.role.replace('_', ' ').toUpperCase()}</p>
                        <p><strong>Team:</strong> ${data.team_name}</p>
                        <p><strong>Team Owner:</strong> ${data.owner_name}</p>
                    `;
                } else {
                    document.getElementById('errorState').style.display = 'block';
                    document.getElementById('errorText').textContent = data.message || 'Invalid or expired invitation.';
                }
            } catch (error) {
                document.getElementById('loadingState').style.display = 'none';
                document.getElementById('errorState').style.display = 'block';
                document.getElementById('errorText').textContent = 'Failed to load invitation details.';
            }
        }

        document.addEventListener('DOMContentLoaded', loadInvitationDetails);
    </script>
</body>
</html>
