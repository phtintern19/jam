<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Live Auction Dashboard - Sportify</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="css/index.css">
    <link rel="stylesheet" href="css/admin-dashboard.css">
    <style>
        .auction-controls {
            background: #1e293b;
            padding: 1.5rem;
            border-radius: 0.75rem;
            margin-top: 1.5rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 1rem;
        }

        .auction-stat-card {
            background: #0f172a;
            padding: 1.5rem;
            border-radius: 0.5rem;
            text-align: center;
            border: 1px solid #334155;
        }

        .stat-value {
            font-size: 2rem;
            font-weight: 700;
            color: #fca5a5;
            margin-bottom: 0.5rem;
        }

        .stat-label {
            color: #94a3b8;
            font-size: 0.875rem;
        }

        .control-btn {
            background-color: #3b82f6;
            color: white;
            padding: 0.75rem 1.5rem;
            border-radius: 0.5rem;
            font-weight: 600;
            border: none;
            cursor: pointer;
            transition: all 0.2s;
            width: 100%;
        }

        .control-btn:hover {
            opacity: 0.9;
            transform: translateY(-1px);
        }

        .control-btn.danger {
            background-color: #ef4444;
        }

        .control-btn.success {
            background-color: #10b981;
        }

        .control-btn.warning {
            background-color: #f59e0b;
        }

        .player-display {
            display: flex;
            align-items: center;
            gap: 2rem;
            background: #1e293b;
            padding: 2rem;
            border-radius: 0.75rem;
            margin-bottom: 2rem;
        }

        .player-large-avatar {
            width: 150px;
            height: 150px;
            border-radius: 50%;
            background: #334155;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 4rem;
            color: #94a3b8;
            object-fit: cover;
        }
    </style>
</head>

<body class="bg-gray-900 text-white">
    <div class="dashboard-container">
        <!-- Sidebar -->
        <aside class="sidebar">
            <div class="logo-container">
                <i class="fas fa-trophy text-orange-500 text-2xl"></i>
                <span class="logo-text text-xl font-bold ml-2">Sportify<span class="text-orange-500">Admin</span></span>
            </div>

            <nav class="nav-menu">
                <a href="admin-dashboard.html" class="nav-item">
                    <i class="fas fa-arrow-left"></i>
                    <span>Back to Dashboard</span>
                </a>
                <div class="nav-item active">
                    <i class="fas fa-gavel"></i>
                    <span>Live Auction</span>
                </div>
            </nav>

            <div class="user-profile mt-auto p-4 border-t border-gray-800">
                <div class="flex items-center gap-3">
                    <div class="w-10 h-10 rounded-full bg-orange-500 flex items-center justify-center font-bold">A</div>
                    <div>
                        <div class="font-medium">Administrator</div>
                        <div class="text-xs text-gray-400">admin@sportify.com</div>
                    </div>
                </div>
            </div>
        </aside>

        <!-- Main Content -->
        <main class="main-content p-8 w-full">
            <header class="flex justify-between items-center mb-8">
                <div>
                    <h1 class="text-2xl font-bold mb-2">Live Auction Control</h1>
                    <p class="text-gray-400" id="auctionTitle">Loading auction details...</p>
                </div>
                <div class="flex gap-4">
                    <span id="connectionStatus"
                        class="px-3 py-1 rounded-full bg-green-500/20 text-green-400 text-sm font-medium">
                        <i class="fas fa-wifi mr-1"></i> Connected
                    </span>
                    <button
                        class="bg-red-500 hover:bg-red-600 text-white px-4 py-2 rounded-lg text-sm font-medium transition-colors"
                        onclick="endAuction()">
                        End Auction
                    </button>
                </div>
            </header>

            <!-- Auction Status -->
            <div class="grid grid-cols-1 md:grid-cols-4 gap-6 mb-8">
                <div class="auction-stat-card">
                    <div class="stat-value" id="statusDisplay">IN PROGRESS</div>
                    <div class="stat-label">Status</div>
                </div>
                <div class="auction-stat-card">
                    <div class="stat-value text-green-400" id="currentBidDisplay">₹0</div>
                    <div class="stat-label">Current Highest Bid</div>
                </div>
                <div class="auction-stat-card">
                    <div class="stat-value text-blue-400" id="timerDisplay">00:20</div>
                    <div class="stat-label">Time Remaining</div>
                </div>
                <div class="auction-stat-card">
                    <div class="stat-value text-purple-400" id="highestBidderDisplay">-</div>
                    <div class="stat-label">Highest Bidder</div>
                </div>
            </div>

            <!-- Current Player Area -->
            <div id="playerArea" class="player-display">
                <div class="player-large-avatar" id="playerAvatar">
                    <i class="fas fa-user"></i>
                </div>
                <div class="flex-1">
                    <h2 class="text-3xl font-bold mb-2" id="playerName">Waiting for next player...</h2>
                    <div class="flex gap-4 mb-4 text-gray-400">
                        <span id="playerSport"><i class="fas fa-running mr-1"></i> -</span>
                        <span id="playerCategory"><i class="fas fa-star mr-1"></i> -</span>
                        <span id="playerRating"><i class="fas fa-chart-line mr-1"></i> -</span>
                    </div>
                    <div class="text-xl font-medium text-orange-400">Base Price: <span id="playerBasePrice">₹0</span>
                    </div>
                </div>
                <div class="flex flex-col gap-3 min-w-[200px]">
                    <button onclick="soldPlayer()" class="control-btn success"><i class="fas fa-gavel mr-2"></i>
                        SOLD</button>
                    <button onclick="unsoldPlayer()" class="control-btn danger"><i class="fas fa-times-circle mr-2"></i>
                        Unsold</button>
                </div>
            </div>

            <!-- Controls -->
            <div class="auction-controls">
                <button onclick="startNextPlayer()" class="control-btn warning">
                    <i class="fas fa-forward mr-2"></i> Start Next Player
                </button>
                <button onclick="pauseAuction()" id="pauseBtn" class="control-btn">
                    <i class="fas fa-pause mr-2"></i> Pause Timer
                </button>
                <button onclick="resetTimer()" class="control-btn">
                    <i class="fas fa-redo mr-2"></i> Reset Timer
                </button>
            </div>

            <!-- Modal for messages -->
            <div id="modalOverlay" class="modal-overlay"
                style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.7); z-index: 1000; justify-content: center; align-items: center;">
                <div class="bg-slate-800 p-8 rounded-lg max-w-md w-full mx-4 shadow-2xl border border-slate-700">
                    <h3 id="modalTitle" class="text-xl font-bold text-white mb-4">Title</h3>
                    <p id="modalMessage" class="text-gray-300 mb-6">Message</p>
                    <button onclick="closeModal()"
                        class="w-full bg-orange-500 hover:bg-orange-600 text-white py-2 rounded-lg font-medium transition-colors">Close</button>
                </div>
            </div>

        </main>
    </div>

    <script src="js/auction-dashboard.js"></script>
</body>

</html>
